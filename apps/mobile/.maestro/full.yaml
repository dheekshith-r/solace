# Solace core flows on the release APK against the live API. Start with run-phone-test.ps1 only,
# after prepare-phone-test.ps1 and with Solace pinned (Ddk's rules, Nov 7).
# Taps are by test ID only; solace-root is asserted before steps; no back/home/coordinates.
# No launchApp: stopping the pinned app ends pinning and locks the phone.
appId: com.ddk.solace
---
- runFlow: assert-solace.yaml

# --- Onboarding ---
- extendedWaitUntil:
    visible: "A calm place to land"
    timeout: 10000
- takeScreenshot: 01-onboarding
- tapOn: { id: "button-get-started" }
- runFlow: assert-solace.yaml
- tapOn: { id: "button-nice-to-meet-you" }
- runFlow: assert-solace.yaml
- tapOn: { id: "chip-better-sleep" }
- tapOn: { id: "button-continue" }
- runFlow: assert-solace.yaml
- assertVisible: "Gentle reminders"
# Permission is pre-granted by the prepare script, so no system dialog opens.
- tapOn: { id: "button-turn-on-reminders" }

# --- Sign up ---
- runFlow: assert-solace.yaml
- assertVisible: "Create your account"
- tapOn: { id: "field-name" }
- inputText: "Smoke"
- tapOn: { id: "field-email" }
- inputText: ${EMAIL}
- tapOn: { id: "field-password" }
- inputText: ${PASSWORD}
- hideKeyboard
- runFlow: assert-solace.yaml
- tapOn: { id: "checkbox-im-18-or-older" }
- tapOn: { id: "button-create-account" }
- runFlow: assert-solace.yaml

# --- Today: nothing chosen until the first tap ---
- extendedWaitUntil:
    visible: "How are you arriving?"
    timeout: 65000
- runFlow: assert-solace.yaml
- assertVisible:
    id: "mood-okay"
    selected: false
- takeScreenshot: 02-today
- tapOn: { id: "mood-good" }
- runFlow: assert-solace.yaml
- takeScreenshot: 03-today-good

# --- Sola: reply, suggestion card, continue, delete ---
- tapOn: { id: "tab-sola" }
- runFlow: assert-solace.yaml
- takeScreenshot: 04-sola-tab
- tapOn: { id: "button-new-conversation" }
- runFlow: assert-solace.yaml
- assertVisible: "What's on your mind?"
- assertVisible: "Here, no rush"
- assertNotVisible: { id: "tab-sola" }
- takeScreenshot: 05-chat-empty
- tapOn: { id: "chip-i-cant-sleep" }
- extendedWaitUntil:
    visible: { id: "bubble-sola" }
    timeout: 45000
- extendedWaitUntil:
    notVisible: { id: "sola-typing" }
    timeout: 45000
- runFlow: assert-solace.yaml
# The model decides whether to suggest something; the screenshot shows which.
- assertVisible:
    id: "suggestion-card"
    optional: true
- takeScreenshot: 06-chat-reply
- tapOn: { id: "field-message" }
- inputText: "Thanks, that helps a little."
- tapOn: { id: "button-send" }
- runFlow: assert-solace.yaml
- extendedWaitUntil:
    notVisible: { id: "sola-typing" }
    timeout: 45000
- hideKeyboard
- runFlow: assert-solace.yaml
- takeScreenshot: 07-chat-continued
- tapOn: { id: "action-delete-conversation" }
- assertVisible: "Delete this conversation?"
- takeScreenshot: 08-chat-delete-confirm
# Solace's own confirm dialog: its Delete button is the dialog's positive button.
- tapOn: { id: "android:id/button1" }
- extendedWaitUntil:
    visible: { id: "tab-sola" }
    timeout: 10000
- runFlow: assert-solace.yaml
- extendedWaitUntil:
    visible: "Tell Sola what's on your mind"
    timeout: 10000
- takeScreenshot: 09-sola-after-delete

# --- You ---
- tapOn: { id: "tab-you" }
- runFlow: assert-solace.yaml
- assertVisible: "Your check-ins"
- assertVisible: { id: "calendar-previous" }
- takeScreenshot: 10-you

# --- Breathe: one Calm session (56 s) ---
- scrollUntilVisible:
    element: { id: "row-breathe" }
- tapOn: { id: "row-breathe" }
- runFlow: assert-solace.yaml
- tapOn: { id: "mood-low" }
- tapOn: { id: "button-continue" }
- runFlow: assert-solace.yaml
- assertVisible: "Pick a rhythm"
- tapOn: { id: "button-start" }
- runFlow: assert-solace.yaml
- takeScreenshot: 11-breathe-session
- extendedWaitUntil:
    visible: "How do you feel now?"
    timeout: 90000
- runFlow: assert-solace.yaml
- tapOn: { id: "mood-good" }
- tapOn: { id: "button-save" }
- extendedWaitUntil:
    visible: "Nicely done"
    timeout: 30000
- runFlow: assert-solace.yaml
- takeScreenshot: 12-breathe-done
- tapOn: { id: "button-done" }
- runFlow: assert-solace.yaml

# --- Reflect: Mood check-in, support prompt must show ---
- scrollUntilVisible:
    element: { id: "row-reflect" }
- tapOn: { id: "row-reflect" }
- runFlow: assert-solace.yaml
- tapOn: { id: "card-reflect-mood" }
- runFlow: assert-solace.yaml
- assertVisible: "This isn't a test, there are no wrong answers. You can stop anytime."
- tapOn: { id: "button-begin" }
- repeat:
    times: 4
    commands:
      - runFlow: assert-solace.yaml
      - tapOn: { id: "row-nearly-every-day" }
- extendedWaitUntil:
    visible: "Want to talk to someone right now?"
    timeout: 30000
- runFlow: assert-solace.yaml
- takeScreenshot: 13-reflect-result
- scrollUntilVisible:
    element: { id: "button-done" }
- tapOn: { id: "button-done" }
- runFlow: assert-solace.yaml
- tapOn: { id: "solace-back" }
- runFlow: assert-solace.yaml

# --- Reminders: test notification ---
- scrollUntilVisible:
    element: { id: "row-reminders" }
- tapOn: { id: "row-reminders" }
- runFlow: assert-solace.yaml
- assertVisible: "Mood check-in"
- scrollUntilVisible:
    element: { id: "button-send-a-test-notification" }
- tapOn: { id: "button-send-a-test-notification" }
- extendedWaitUntil:
    visible: "Sent. It should arrive in a moment."
    timeout: 5000
- runFlow: assert-solace.yaml
- takeScreenshot: 14-reminders-test-sent
- tapOn: { id: "solace-back" }
- runFlow: assert-solace.yaml

# --- Log out, log in ---
- scrollUntilVisible:
    element: { id: "row-log-out" }
- tapOn: { id: "row-log-out" }
# Straight to log-in, never a signed-out You screen.
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
- assertNotVisible: { id: "button-sign-in" }
- runFlow: assert-solace.yaml
- tapOn: { id: "field-email" }
- inputText: ${EMAIL}
- tapOn: { id: "field-password" }
- inputText: ${PASSWORD}
- hideKeyboard
- runFlow: assert-solace.yaml
- tapOn: { id: "button-log-in" }
- extendedWaitUntil:
    visible: "How are you arriving?"
    timeout: 65000
- runFlow: assert-solace.yaml
- takeScreenshot: 15-logged-back-in

# --- Clean up: delete the throwaway account in the app ---
- tapOn: { id: "tab-you" }
- runFlow: assert-solace.yaml
- scrollUntilVisible:
    element: { id: "row-privacy-and-data" }
- tapOn: { id: "row-privacy-and-data" }
- runFlow: assert-solace.yaml
- scrollUntilVisible:
    element: { id: "field-type-delete-to-confirm" }
- tapOn: { id: "field-type-delete-to-confirm" }
- inputText: "DELETE"
- hideKeyboard
- runFlow: assert-solace.yaml
- tapOn: { id: "button-delete-my-account" }
- extendedWaitUntil:
    visible: "A calm place to land"
    timeout: 30000
- takeScreenshot: 16-account-deleted
