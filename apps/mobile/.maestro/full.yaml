# Solace end-to-end phone test, tickets 04 to 12 (spec section 10). Release APK, live API.
#
# Safety rules (Ddk, Nov 7):
# - Runs only after Ddk approves the run and pins Solace with Android App pinning.
# - Scoped to com.ddk.solace. Every step is preceded by assert-solace.yaml; if Solace is not in
#   front, the flow stops immediately.
# - No Back or Home presses (no `back`, no `pressKey`), no coordinates: taps use exact text or
#   accessibility labels only. Navigation uses Solace's own buttons and tabs.
#
# Run (from apps/mobile):
#   maestro test .maestro/full.yaml -e EMAIL=smoke-xxxx@example.com -e PASSWORD=... --format junit
# The throwaway account is deleted at the end through Privacy and data > Delete my account.
appId: com.ddk.solace
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- launchApp:
    clearState: true
- runFlow: assert-solace.yaml

# --- 04 Splash and onboarding -------------------------------------------------------------
- extendedWaitUntil:
    visible: "A calm place to land"
    timeout: 8000
- takeScreenshot: 04-onboarding-step1
- runFlow: assert-solace.yaml
- tapOn: "Get started"
- runFlow: assert-solace.yaml
- assertVisible: "Hi, I'm Sola"
- takeScreenshot: 04-onboarding-step2
- tapOn: "Nice to meet you"
- runFlow: assert-solace.yaml
- assertVisible: "What would help most?"
- tapOn: "Better sleep"
- runFlow: assert-solace.yaml
- takeScreenshot: 04-onboarding-step3
- tapOn: "Continue"
- runFlow: assert-solace.yaml
- assertVisible: "Gentle reminders"
- takeScreenshot: 04-onboarding-step4
# Not now: avoids the system permission dialog, which is outside Solace.
- tapOn: "Not now"

# --- 05 Sign up -----------------------------------------------------------------------------
- runFlow: assert-solace.yaml
- assertVisible: "Create your account"
- takeScreenshot: 05-signup-empty
- tapOn: "Create account"
- runFlow: assert-solace.yaml
- assertVisible: "Tell Sola what to call you."
- takeScreenshot: 05-signup-errors
- tapOn: "What should Sola call you?"
- inputText: "Smoke"
- runFlow: assert-solace.yaml
- tapOn: "you@example.com"
- inputText: ${EMAIL}
- runFlow: assert-solace.yaml
- tapOn: "At least 8 characters"
- inputText: ${PASSWORD}
- runFlow: assert-solace.yaml
- hideKeyboard
- runFlow: assert-solace.yaml
- tapOn: "I'm 18 or older"
- runFlow: assert-solace.yaml
- takeScreenshot: 05-signup-filled
- tapOn: "Create account"
- runFlow: assert-solace.yaml

# --- Today (06): lands here after sign-up; a mood tap saves a check-in ---------------------
- extendedWaitUntil:
    visible: "How are you arriving?"
    timeout: 20000
- runFlow: assert-solace.yaml
- takeScreenshot: 06-today
- tapOn: "Good"
- runFlow: assert-solace.yaml
- takeScreenshot: 06-today-mood-good

# --- 08 Sola chat ---------------------------------------------------------------------------
- tapOn: "Sola"
- runFlow: assert-solace.yaml
- assertVisible: "New conversation"
- takeScreenshot: 08-sola-tab
- tapOn: "New conversation"
- runFlow: assert-solace.yaml
- assertVisible: "What's on your mind?"
- takeScreenshot: 08-conversation-empty
- tapOn: "I can't sleep"
- runFlow: assert-solace.yaml
# Sola's reply streams in; wait for the message box to be ready again (send re-enabled).
- extendedWaitUntil:
    visible:
      id: "solace-root"
    timeout: 3000
- extendedWaitUntil:
    notVisible: "Sola is replying"
    timeout: 30000
- runFlow: assert-solace.yaml
- takeScreenshot: 08-conversation-reply
- tapOn: "Back"
- runFlow: assert-solace.yaml
- takeScreenshot: 08-sola-history

# --- 12 You tab, Appearance, Privacy, Resources ---------------------------------------------
- tapOn: "You"
- runFlow: assert-solace.yaml
- assertVisible: "Your constellation"
- takeScreenshot: 12-you
- tapOn: "Resources"
- runFlow: assert-solace.yaml
- assertVisible: "Get help now"
- takeScreenshot: 12-resources
- tapOn: "Get help now"
- runFlow: assert-solace.yaml
- assertVisible: "Call Tele-MANAS 14416"
- takeScreenshot: 12-get-help
- tapOn: "Back"
- runFlow: assert-solace.yaml
- tapOn: "Back"
- runFlow: assert-solace.yaml

# --- 09 Breathe (from the You tab's card): one full Calm session, about a minute ------------
- tapOn: "Breathe"
- runFlow: assert-solace.yaml
- assertVisible: "How are you, right now?"
- tapOn: "Low"
- runFlow: assert-solace.yaml
- tapOn: "Continue"
- runFlow: assert-solace.yaml
- assertVisible: "Pick a rhythm"
- takeScreenshot: 09-pattern
- tapOn: "Start"
- runFlow: assert-solace.yaml
- takeScreenshot: 09-session
- extendedWaitUntil:
    visible: "How do you feel now?"
    timeout: 75000
- runFlow: assert-solace.yaml
- tapOn: "Good"
- runFlow: assert-solace.yaml
- tapOn: "Save"
- runFlow: assert-solace.yaml
- extendedWaitUntil:
    visible: "Nicely done"
    timeout: 20000
- takeScreenshot: 09-result
- tapOn: "Done"
- runFlow: assert-solace.yaml

# --- 10 Reflect: Mood, all "Nearly every day" (support prompt must show) --------------------
- tapOn: "Reflect"
- runFlow: assert-solace.yaml
- assertVisible: "Three friendly check-ins, not diagnoses. Four questions each, about a minute. Sola asks one at a time."
- takeScreenshot: 10-hub
- tapOn: "Mood. How the last two weeks have felt."
- runFlow: assert-solace.yaml
- assertVisible: "This isn't a test, there are no wrong answers. You can stop anytime."
- takeScreenshot: 10-opening
- tapOn: "Begin"
- runFlow: assert-solace.yaml
- repeat:
    times: 4
    commands:
      - runFlow: assert-solace.yaml
      - tapOn: "Nearly every day"
- runFlow: assert-solace.yaml
- extendedWaitUntil:
    visible: "Want to talk to someone right now?"
    timeout: 20000
- takeScreenshot: 10-result-support
- tapOn: "Done"
- runFlow: assert-solace.yaml
- tapOn: "Back"
- runFlow: assert-solace.yaml

# --- 11 Reminders: page and a test notification (checked in the shade by Ddk, not tapped) ---
- tapOn: "Reminders"
- runFlow: assert-solace.yaml
- assertVisible: "Mood check-in"
- takeScreenshot: 11-reminders
- tapOn: "Back"
- runFlow: assert-solace.yaml

# --- Clean up: delete the throwaway account from inside the app -----------------------------
- tapOn: "Privacy and data"
- runFlow: assert-solace.yaml
- assertVisible: "Delete your account"
- tapOn: "Type DELETE to confirm"
- inputText: "DELETE"
- runFlow: assert-solace.yaml
- hideKeyboard
- runFlow: assert-solace.yaml
- tapOn: "Delete my account"
- runFlow: assert-solace.yaml
- extendedWaitUntil:
    visible: "A calm place to land"
    timeout: 20000
- takeScreenshot: 99-account-deleted
