name: Bug report
description: Something in Solace does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for the report. Do not paste private data here; this page is public.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Tell us what you saw, and what you expected to see.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it again
      placeholder: |
        1. Open Solace
        2. Tap a mood on Today
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - The Android app
        - The API
        - Both
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: For example, POCO X7 Pro, HyperOS 2
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Account
      options:
        - Signed in
        - Signed out
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
